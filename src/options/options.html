<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YT Quick Filter - 設定</title>
<link rel="icon" type="image/png" href="../../assets/icons/16.png" />
<link rel="stylesheet" href="options.css" />
</head>
<body>
  <div class="page">
    <header class="page-header">
      <img src="../../assets/icons/48.png" alt="" class="header-icon" />
      <h1>YT Quick Filter</h1>
      <label class="switch" title="拡張機能全体のON/OFF">
        <input type="checkbox" id="global-toggle" />
        <span class="slider"></span>
      </label>
      <span class="global-status" id="global-status">有効</span>
    </header>

    <main class="page-main">
      <section class="card">
        <h2>チャンネルを追加</h2>
        <form id="channel-form" class="add-form">
          <input type="text" id="channel-value" placeholder="例: UCxxxxxxxxxxxxxxxxxxxxxx または @ハンドル名" autocomplete="off" />
          <button type="submit">＋ 追加</button>
        </form>
        <p class="hint">
          チャンネルID(<code>UC...</code>)・<code>@ハンドル名</code>・チャンネルURLのいずれでも入力できます。もう一方の識別子は自動で解決して一緒に保存されます。
        </p>
        <div class="status-line" id="channel-status"></div>
      </section>

      <section class="card">
        <h2>タイトルキーワードを追加</h2>
        <form id="title-form" class="add-form">
          <input type="text" id="title-value" placeholder="例: 【切り抜き】 または /正規表現/i" autocomplete="off" />
          <button type="submit">＋ 追加</button>
        </form>
        <p class="hint">
          通常は部分一致のキーワードとして扱われます。<code>/pattern/flags</code> の形式で書くと正規表現として扱われます。
        </p>
      </section>

      <section class="card">
        <div class="card-header-row">
          <h2>登録済みフィルター</h2>
          <input type="search" id="search-input" placeholder="検索..." autocomplete="off" />
        </div>

        <div class="filter-group">
          <h3>チャンネル <span class="count" id="channel-count">0</span></h3>
          <ul class="filter-list" id="channel-list"></ul>
        </div>

        <div class="filter-group">
          <h3>タイトル <span class="count" id="title-count">0</span></h3>
          <ul class="filter-list" id="title-list"></ul>
        </div>
      </section>

      <section class="card">
        <h2>バックアップ</h2>
        <div class="button-row">
          <button type="button" id="export-btn">⭱ エクスポート</button>
          <button type="button" id="import-btn">⭳ インポート</button>
          <input type="file" id="import-file" accept="application/json" style="display:none" />
        </div>
        <div class="status-line" id="backup-status"></div>
      </section>
    </main>
  </div>

  <script src="../lib/filterStore.js"></script>
  <script src="options.js"></script>
</body>
</html>
