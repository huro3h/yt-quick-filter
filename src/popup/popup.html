<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YT Quick Filter</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup">
    <header class="popup-header">
      <div class="brand">
        <img src="../../assets/icons/48.png" alt="" class="brand-icon" />
        <span class="brand-name">YT Quick Filter</span>
      </div>
      <div class="header-actions">
        <label class="switch" title="拡張機能全体のON/OFF">
          <input type="checkbox" id="global-toggle" />
          <span class="slider"></span>
        </label>
        <button type="button" id="open-options" class="settings-btn" title="設定を開く" aria-label="設定を開く">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <div class="search-row">
      <input type="search" id="search-input" placeholder="フィルターを検索..." autocomplete="off" />
    </div>

    <div class="tab-bar" role="tablist">
      <div class="tab-item">
        <label class="switch small" title="タイトルフィルターを一括ON/OFF">
          <input type="checkbox" id="title-category-toggle" />
          <span class="slider"></span>
        </label>
        <button type="button" class="tab-btn active" id="tab-title" data-tab="title" role="tab" aria-selected="true">
          タイトル <span class="count" id="title-count">0</span>
        </button>
      </div>
      <div class="tab-item">
        <label class="switch small" title="チャンネルフィルターを一括ON/OFF">
          <input type="checkbox" id="channel-category-toggle" />
          <span class="slider"></span>
        </label>
        <button type="button" class="tab-btn" id="tab-channel" data-tab="channel" role="tab" aria-selected="false">
          チャンネル <span class="count" id="channel-count">0</span>
        </button>
      </div>
    </div>

    <div class="list-section" id="panel-title" role="tabpanel">
      <ul class="filter-list" id="title-list"></ul>
      <p class="empty-hint" id="title-empty">登録されたタイトルフィルターはありません</p>
    </div>

    <div class="list-section" id="panel-channel" role="tabpanel" hidden>
      <ul class="filter-list" id="channel-list"></ul>
      <p class="empty-hint" id="channel-empty">登録されたチャンネルフィルターはありません</p>
    </div>
  </div>

  <script src="../lib/filterStore.js"></script>
  <script src="popup.js"></script>
</body>
</html>
